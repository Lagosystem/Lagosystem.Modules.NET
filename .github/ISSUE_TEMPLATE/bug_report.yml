name: "Bug report / Relato de erro"
description: "Report reproducible defects / Relate defeitos reproduzíveis"
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thank you / Obrigado! Do not include secrets or vulnerabilities; read SECURITY.md."
  - type: input
    id: component
    attributes:
      label: "Affected component / Componente"
      placeholder: "Validate.IsCnpj, Financials, Extensions..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to reproduce / Como reproduzir"
      description: "Include a minimal sanitized example / Inclua exemplo mínimo sem dados sensíveis"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected vs. actual / Esperado e obtido"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Environment / Ambiente"
      placeholder: "OS, .NET SDK/runtime, commit or package version"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: "Additional context / Informações adicionais"
