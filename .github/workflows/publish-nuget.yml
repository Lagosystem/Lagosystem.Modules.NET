name: Publish Lagosystem.Modules.NET to NuGet

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: lagosystem-modules-nuget
  cancel-in-progress: false

jobs:
  publish:
    name: Test, pack and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      LIBRARY_PROJECT: src/Lagosystem.Modules/Lagosystem.Modules.csproj
      TEST_PROJECT: tests/Lagosystem.Modules.Tests/Lagosystem.Modules.Tests.csproj
      PACKAGE_ID: Lagosystem.Modules.NET

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set release version
        shell: bash
        run: |
          echo "PACKAGE_VERSION=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: dotnet restore "$TEST_PROJECT"

      - name: Build library and tests
        run: |
          dotnet build "$TEST_PROJECT" \
            --configuration Release \
            --no-restore \
            -p:Version="$PACKAGE_VERSION" \
            -p:ContinuousIntegrationBuild=true

      - name: Run unit tests
        run: |
          dotnet test "$TEST_PROJECT" \
            --configuration Release \
            --no-build \
            --no-restore

      - name: Setup Python for package icon optimization
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Optimize NuGet icon to 128x128 and under 1 MiB
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          icon_path = Path("src/Lagosystem.Modules/Assets/6fa00a3b-9673-4ae6-af59-267f00dc5825.png")
          with Image.open(icon_path) as original:
              image = original.convert("RGBA")
              image.thumbnail((128, 128), Image.Resampling.LANCZOS)
              icon = Image.new("RGBA", (128, 128), (0, 0, 0, 0))
              icon.alpha_composite(image, ((128 - image.width) // 2, (128 - image.height) // 2))
              icon.save(icon_path, format="PNG", optimize=True)

          if icon_path.stat().st_size >= 1024 * 1024:
              raise RuntimeError("NuGet package icon exceeds the 1 MiB limit")
          PY

      - name: Pack release
        run: |
          dotnet pack "$LIBRARY_PROJECT" \
            --configuration Release \
            --no-build \
            --no-restore \
            -p:PackageVersion="$PACKAGE_VERSION" \
            -p:ContinuousIntegrationBuild=true \
            --output ./artifacts

      - name: Authenticate with NuGet.org (OIDC)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: LeonardoNicolas

      - name: Publish package and symbols
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./artifacts/${PACKAGE_ID}.${PACKAGE_VERSION}.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
